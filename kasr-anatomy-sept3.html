<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KASR Anatomy · Sept 3</title><style>:root{--b:#07090e;--p:#11151d;--p2:#171d27;--t:#f6f8fc;--d:#97a3b5;--l:#293242;--o:#ff6a3d;--g:#51dca5;--w:#f4c85f;--r:#ff8493}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#a{max-width:720px;margin:auto;min-height:100dvh;padding:18px 15px 28px}h1{font-size:29px;line-height:1.05;margin:5px 0 8px;font-weight:950}.ey{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--d);font-weight:850}.mut{color:var(--d);font-size:13px;line-height:1.45}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:16px;margin:12px 0}.big{font-size:21px;line-height:1.28;font-weight:870}.row{display:flex;gap:8px;flex-wrap:wrap}.between{justify-content:space-between;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:var(--p2);font-size:11px;font-weight:850}.prog{height:9px;border-radius:99px;background:#202735;overflow:hidden}.bar{height:100%;background:var(--o)}button{min-height:48px;border:1px solid var(--l);border-radius:14px;background:var(--p2);color:var(--t);padding:10px 13px;font:inherit;font-weight:850}button.primary{width:100%;border:0;background:linear-gradient(135deg,#ff5830,#ff7a45);color:white}.good{color:var(--g)}.warn{color:var(--w)}.bad{color:var(--r)}.ans{background:#0d2119;border:1px solid #255d48;border-radius:15px;padding:13px;margin-top:11px}.fb{background:#131b2b;border:1px solid #314465;border-radius:15px;padding:13px;margin-top:11px}.hide{display:none}.pct{font-size:44px;font-weight:950;line-height:1}.stat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #1e2530}.stat:last-child{border:0}img{display:block;width:100%;max-height:42dvh;object-fit:contain;background:#090b10;border-radius:15px;border:1px solid #202938;margin:10px 0}</style></head><body><div id="a"></div><script>const Q=[
{id:'b1',c:'BONES',q:'Hip bone: fastest siding rule?',a:'Acetabulum lateral; ischial tuberosity posterior.',img:'https://kasr-anatomy-final-boss-kla1p3rxe-mohammedwessam2007s-projects.vercel.app/stations/bone_hip_lateral.jpg'},
{id:'b2',c:'BONES',q:'ASIS marked: classic muscle attachment?',a:'Sartorius.'},
{id:'b3',c:'BONES',q:'AIIS marked: classic muscle attachment?',a:'Rectus femoris, straight head.'},
{id:'b6',c:'BONES',q:'Femur: fastest siding rule?',a:'Head medial; linea aspera posterior.',img:'https://kasr-anatomy-final-boss-kla1p3rxe-mohammedwessam2007s-projects.vercel.app/stations/bone_femur_post.jpg'},
{id:'b7',c:'BONES',q:'Lesser trochanter marked: what inserts?',a:'Iliopsoas.'},
{id:'b8',c:'BONES',q:'Adductor tubercle marked: attachment?',a:'Adductor magnus, ischial/hamstring part.'},
{id:'b10',c:'BONES',q:'Greater trochanter: name 3 classic attachments.',a:'Piriformis, gluteus medius, gluteus minimus.'},
{id:'b11',c:'BONES',q:'Tibia: fastest siding rule?',a:'Tibial tuberosity anterior; medial malleolus medial.',img:'https://kasr-anatomy-final-boss-kla1p3rxe-mohammedwessam2007s-projects.vercel.app/stations/bone_tibfib_ant.jpg'},
{id:'b13',c:'BONES',q:'Soleal line marked: muscle origin?',a:'Soleus.'},
{id:'b14',c:'BONES',q:'Groove behind medial tibial condyle: what inserts?',a:'Semimembranosus.'},
{id:'m1',c:'CADAVER',q:'Tensor fasciae latae: insertion?',a:'Iliotibial tract.',f:'If damaged: lateral hip + IT tract relation.',img:'https://kasr-anatomy-final-boss-kla1p3rxe-mohammedwessam2007s-projects.vercel.app/stations/cad_tfl_a.jpg'},
{id:'m2',c:'CADAVER',q:'IT tract: name the 2 muscles attached.',a:'Tensor fasciae latae and gluteus maximus.',f:'IT tract is robust even if muscles are cut.'},
{id:'m3',c:'CADAVER',q:'Sartorius: give 2 actions.',a:'Flexes hip and knee; also abducts and laterally rotates thigh.',f:'Use diagonal strap course from ASIS toward pes anserinus.',img:'https://kasr-anatomy-final-boss-kla1p3rxe-mohammedwessam2007s-projects.vercel.app/stations/cad_sart_a.jpg'},
{id:'m4',c:'CADAVER',q:'Rectus femoris: nerve + 2 actions.',a:'Femoral nerve; extends knee and flexes hip.',f:'Use central superficial anterior-thigh position + quadriceps tendon.',img:'https://kasr-anatomy-final-boss-kla1p3rxe-mohammedwessam2007s-projects.vercel.app/stations/cad_rectus_femoris.jpg'},
{id:'m12',c:'CADAVER',q:'Tibialis anterior: insertion + 2 actions.',a:'Medial cuneiform + base of 1st metatarsal; dorsiflexion + inversion.',f:'Use position immediately lateral to tibial crest.'},
{id:'m13',c:'CADAVER',q:'Soleus: insertion + main action.',a:'Calcaneus via Achilles tendon; plantarflexes ankle.',f:'Broad deep calf beneath gastrocnemius feeding Achilles.'},
{id:'n1',c:'NERVE',q:'Sciatic nerve: terminal branches?',a:'Tibial + common peroneal/fibular nerves.'},
{id:'a2',c:'VESSEL',q:'Femoral artery: how does it end?',a:'Passes through adductor hiatus and becomes popliteal artery.'}
];const K='kasr-sept3-live-v1';let S=JSON.parse(localStorage.getItem(K)||'{"done":{},"state":{},"i":0}');let order=Q.filter(x=>!S.done[x.id]);function save(){localStorage.setItem(K,JSON.stringify(S))}function pct(){return Math.round(Object.keys(S.done).length/Q.length*100)}function home(){const p=pct();a.innerHTML=`<div class=ey>SEPT 3 · 24H RETRIEVAL</div><h1>🦴 KASR Station Sniper</h1><p class=mut>Hard cap: about 20 minutes. Bones + high-recurrence cadaver anchors. Wrong answers only route tomorrow; they do not create a fake readiness score.</p><div class=card><div class='row between'><div><div class=ey>TODAY</div><div class=pct>${p}%</div></div><span class=pill>MAX ~20 MIN</span></div><div class=prog style='margin-top:10px'><div class=bar style='width:${p}%'></div></div><div class=stat><b>Finished</b><span>${Object.keys(S.done).length}/${Q.length}</span></div><div class=stat><b>Remaining</b><span>${Q.length-Object.keys(S.done).length}</span></div></div><div class=card><b>Cadaver rule</b><p class=mut>Do not demand a pristine muscle. Recognize by compartment → course → tendon → bony attachment → neighbors.</p></div><button class=primary onclick=start()>${p===100?'TODAY COMPLETE':'FINISH TODAY\'S WORK'}</button><button style='width:100%;margin-top:8px' onclick=reset()>RESET TODAY</button>`}function start(){order=Q.filter(x=>!S.done[x.id]);S.i=0;if(!order.length)return home();render()}function render(){if(S.i>=order.length)return home();let x=order[S.i],p=pct();a.innerHTML=`<div class='row between'><span class=ey>${x.c}</span><span>${p}%</span></div><div class=prog><div class=bar style='width:${p}%'></div></div><div class=card>${x.img?`<img src='${x.img}' onerror='this.style.display="none"'>`:''}<div class=big>${x.q}</div><div id=ans class='ans hide'><b>Answer:</b> ${x.a}</div><div id=fb class='fb hide'><b>Damaged specimen fallback:</b> ${x.f||'Use relations, compartment and attachment rather than pristine appearance.'}</div></div><div class=row><button class=good onclick="mark('know')">KNOW COLD</button><button class=warn onclick="mark('partial')">PARTIAL</button><button class=bad onclick="mark('idk')">IDK → TEACH</button></div>${x.c==='CADAVER'?'<button style="width:100%;margin-top:8px" onclick="document.getElementById(\'fb\').classList.remove(\'hide\');document.getElementById(\'nx\').classList.remove(\'hide\')">SPECIMEN DAMAGED</button>':''}<div id=nx class=hide style='margin-top:8px'><button class=primary onclick=next()>NEXT</button></div>`}function mark(r){let x=order[S.i];S.done[x.id]=true;S.state[x.id]=r;save();if(r==='know')next();else{document.getElementById('ans').classList.remove('hide');document.getElementById('nx').classList.remove('hide')}}function next(){S.i++;save();render()}function reset(){if(confirm('Reset Sept 3 progress?')){S={done:{},state:{},i:0};save();home()}}home();</script></body></html>
